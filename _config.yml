# Site settings
title: "Willmer R. Quiñones R."
short_title: "W.R.Q.R."
description: "Personal academic page of Willmer R. Quiñones R. — AI researcher, postdoctoral fellow at UNIST LAIT."
url: "https://wrafell.github.io"
baseurl: ""
lang: en

author:
  name: "Willmer R. Quiñones R."
  role: "Postdoctoral Research Associate"
  affiliation: "LAIT, UNIST"
  location: "South Korea"
  links:
    - label: "CV"
      url: "/assets/files/cv.pdf"
    - label: "Email"
      url: "mailto:wrafell@kaist.ac.kr"
    - label: "GitHub"
      url: "https://github.com/wrafell"
    - label: "X"
      url: "https://x.com/WRafell"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/wrafell/"

# Content
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - local
  - vendor
  - .bundle

permalink: /:categories/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: page
